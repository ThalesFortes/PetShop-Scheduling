<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" 
        rel="stylesheet">

  <link rel="stylesheet" href="./src/styles/index.css">
  <link rel="icon" href="./src/assets/pet-icon.svg">

  <title>PetShop Scheduling</title>
  
</head>
<body>
  <div id="app">
    <header id="logo">
      <img src="./src/assets/logo.png" alt="logo">
    </header>
    <main>
      <section id="form-header">
        <header>
          <h1>Sua agenda</h1>
          <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
        </header>
        <div class="date-picker-wrapper">
          <i><img src="./src/assets/calendar.svg" alt="Calendario"></i>
          <input type="date"
                id="date"
                name="date"
                for="petshop-form"
                aria-label="Selecione uma data"
                required>
        </div>
      </section>

      <section id="schedule-list">
        <header id="morning">
          <img src="./src/assets/sun.svg" alt="período da manhã">
          <strong>Manhã</strong>
          <span>09h-12h</span>
        </header>
        <ul id="morning" class="list">
          <li>
            <strong>09:00</strong>
            <strong>Animal Nome</strong>
            <span>/ Médico nome</span>
            <p>Descrição</p>
            <button>Remover agendamento</button>
          </li>
          <li>
            <strong>10:00</strong>
            <strong>Animal Nome 2</strong>
            <span>/ Médico nome 2</span>
            <p>Descrição 2</p>
            <button>Remover agendamento</button>
          </li>
          <li>
            <strong>11:00</strong>
            <strong>Animal Nome 3</strong>
            <span>/ Médico nome 3</span>
            <p>Descrição 3</p>
            <button>Remover agendamento</button>
          </li>
        </ul>
      </section>

    </main>
  </div>
  
</body>
</html>
